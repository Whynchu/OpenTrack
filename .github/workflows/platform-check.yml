name: Native platform compile checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            linux: true
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            linux: true
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      RUST_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build libraries
        if: ${{ matrix.linux }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libegl1-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libssl-dev \
            pkg-config

      - name: Install the pinned Rust toolchain
        run: |
          channel="$(awk -F '"' '/^channel =/ { print $2; exit }' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          rustup target add "$RUST_TARGET"

      - name: Check workspace and all target-specific code
        run: cargo check --locked --workspace --all-targets --target "$RUST_TARGET"
