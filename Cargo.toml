[workspace]
members = [
    "crates/opentrack-core",
    "crates/opentrack-audio",
    "crates/cpr-inspect",
    "crates/opentrack-app",
    "crates/opentrack-plugins",
    "crates/opentrack-plugin-scan",
    "crates/opentrack-vst3",
]
resolver = "3"
exclude = ["vendor/maolan-asio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
