[package]
name = "opentrack-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
ffmpeg-next = { version = "=9.0.0", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }
