[package]
name = "opentrack-plugin-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Bounded VST3 module discovery and precheck helper for OpenTrack"

[lib]
name = "opentrack_plugin_scan"
path = "src/lib.rs"

[[bin]]
name = "opentrack-plugin-scan"
path = "src/main.rs"

[dependencies]
opentrack-plugins = { path = "../opentrack-plugins" }
opentrack-vst3 = { path = "../opentrack-vst3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
