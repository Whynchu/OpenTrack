[package]
name = "opentrack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "opentrack"
path = "src/main.rs"

[features]
default = []
local-asio = ["opentrack-audio/local-asio"]
linux-realtime = ["opentrack-audio/linux-realtime"]
video-ffmpeg = ["opentrack-video/ffmpeg"]

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_dock = { version = "=0.21.1", features = ["serde"] }
rfd = { version = "=0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "=0.48.1", default-features = false }
opentrack-core = { path = "../opentrack-core" }
opentrack-audio = { path = "../opentrack-audio" }
opentrack-plugins = { path = "../opentrack-plugins" }
opentrack-plugin-scan = { path = "../opentrack-plugin-scan" }
opentrack-vst3 = { path = "../opentrack-vst3" }
opentrack-video = { path = "../opentrack-video", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Already provided transitively by eframe; expose its Linux backend-selection
# extension so native tool-window ordering can use the supported X11 backend.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland"] }
x11rb = "=0.13.2"
