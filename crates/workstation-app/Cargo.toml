[package]
name = "opentrack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "opentrack"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_dock = { version = "=0.21.1", features = ["serde"] }
rfd = { version = "=0.17.2", default-features = false }
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workstation-core = { path = "../workstation-core" }
workstation-audio = { path = "../workstation-audio" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
