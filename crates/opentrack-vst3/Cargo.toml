[package]
name = "opentrack-vst3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "VST3 module loading and class enumeration for OpenTrack"

[dependencies]
libloading = "0.8"
opentrack-plugins = { path = "../opentrack-plugins" }
vst3 = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
